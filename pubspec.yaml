name: fitnflaifrontendv2
description: Fitnflai Flutter Frontend

publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

    
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  health: ^13.3.1
  huawei_health: ^6.0.0
  intl: ^0.20.2

  # State management
  provider: ^6.1.2
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

  # HTTP client
  http: ^1.2.1

  # Google Sign In
  google_sign_in: ^6.2.1

  # Apple Sign In
  sign_in_with_apple: ^6.1.3

  # File picker for image/PDF upload
  image_picker: ^1.1.2
  file_picker: ^10.1.9

  # URL launcher for Strava OAuth
  url_launcher: ^6.3.2

  # SVG rendering
  flutter_svg: ^2.0.10

  # Local storage (token persistence)
  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.4.7
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  geolocator_platform_interface: ^4.2.6
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/tests/
    - assets/mock/

dependency_overrides:
  device_info_plus: 13.3.0
  win32: ^6.0.1