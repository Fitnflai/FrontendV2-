name: Deploy iOS to App Store / TestFlight

on:
  # Permite ejecutar el pipeline de manera manual desde la pestaña Actions de GitHub
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Número de compilación (ej. 3)'
        required: true
        default: '3'
      version_name:
        description: 'Nombre de versión (ej. 1.0.1)'
        required: true
        default: '1.0.1'

  # Se ejecuta automáticamente al crear un tag de versión (ej: v1.0.1+3)
  push:
    tags:
      - 'v*'

jobs:
  deploy_ios:
    name: Build & Deploy iOS
    runs-on: macos-14 # Mac con Apple Silicon (M1/M2) y Xcode 15+, obligatorio para compilar con iOS 17 SDK
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        # Necesario únicamente si alguna dependencia de Flutter requiere herramientas de Java para tareas auxiliares
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.0'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner (Generación de Código)
        # Requerido por Freezed y JsonSerializable en Fitnflai
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install Apple Certificate and Provisioning Profile
        # Configuramos los certificados y perfiles de aprovisionamiento temporales en el entorno de compilación
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_DIST_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temporary-keychain-pass"
        run: |
          # Crear variables de rutas temporales
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          CERTIFICATE_PATH=$RUNNER_TEMP/building_cert.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision

          # Decodificar el certificado y el provisioning profile desde los Secrets de GitHub
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          # Crear y desbloquear un llavero (keychain) temporal exclusivo para esta sesión de compilación
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          # Importar el certificado de distribución en el llavero creado
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -A

          # Autorizar al comando codesign para acceder a la clave sin mostrar popups interactivos (se agrega || true porque en macOS Sonoma arm64 este comando puede fallar de forma no crítica)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true

          # Crear la carpeta de perfiles en macOS de destino
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Extraer el UUID real del provisioning profile de forma ultra-robusta usando un script de Python 3 integrado
          UUID=$(python3 -c "import plistlib, sys; content = open(sys.argv[1], 'rb').read(); start = content.find(b'<plist'); end = content.find(b'</plist>') + 8; plist = plistlib.loads(content[start:end]) if start != -1 and end != -1 else {}; print(plist.get('UUID', ''))" "$PP_PATH")

          # Copiar el perfil renombrándolo a <UUID>.mobileprovision
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Generate ExportOptions.plist
        # Este archivo le indica a Xcode cómo exportar el binario (ej. App Store, AdHoc) y qué perfiles usar
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.fitnflai.frontend</key>
                  <string>Fitnflai AppStore Profile</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>destination</key>
              <string>export</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        # Generamos el compilado final (.ipa) aplicando las variables de versión dinámica si se dispara manualmente
        # Forzamos Manual Signing a nivel de xcodebuild para anular la firma automática local en el servidor CI/CD
        # Especificamos el target '-t lib/main.dart' para evitar que Flutter interprete los argumentos de firma como el archivo de entrada
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            flutter build ipa --release \
              -t lib/main.dart \
              --build-name="${{ github.event.inputs.version_name }}" \
              --build-number="${{ github.event.inputs.build_number }}" \
              --export-options-plist=ios/ExportOptions.plist \
              -- \
              CODE_SIGN_STYLE="Manual" \
              DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
              PROVISIONING_PROFILE_SPECIFIER="Fitnflai AppStore Profile" \
              CODE_SIGN_IDENTITY="Apple Distribution"
          else
            flutter build ipa --release \
              -t lib/main.dart \
              --export-options-plist=ios/ExportOptions.plist \
              -- \
              CODE_SIGN_STYLE="Manual" \
              DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
              PROVISIONING_PROFILE_SPECIFIER="Fitnflai AppStore Profile" \
              CODE_SIGN_IDENTITY="Apple Distribution"
          fi

      - name: Upload to Apple App Store Connect / TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'build/ios/ipa/fitnflaifrontendv2.ipa'
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-key-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-content: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
